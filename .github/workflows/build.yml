name: Build CI
on: [push, pull_request]

jobs:
  build-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64
          - os: ubuntu-latest
          # arm
          - os: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # Linux (ubuntu-latest) build
    - name: Run apt
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-suggests --no-install-recommends \
          autoconf \
          automake \
          make \
          g++ \
          liblzma-dev \
          libbz2-dev \
          zlib1g-dev \
          libcurl4-gnutls-dev
    - name: Compile
      run: |
          make -j5

    - name: Check
      run: |
        make check